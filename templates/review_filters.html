<div id="evidence-filters" class="evidence-filters">
<div class="evidence-filter-row" role="group" aria-labelledby="evidence-status-label"><span id="evidence-status-label">核验状态</span><div class="evidence-filter-options"><button type="button" class="subtle" data-evidence-status="pending" aria-pressed="true" aria-controls="{{ review_filter_controls | default('evidence-cards') }}">待核验</button><button type="button" class="subtle" data-evidence-status="approved" aria-pressed="false" aria-controls="{{ review_filter_controls | default('evidence-cards') }}">已核验</button><button type="button" class="subtle" data-evidence-status="excluded" aria-pressed="false" aria-controls="{{ review_filter_controls | default('evidence-cards') }}">已排除</button></div></div>
<div class="evidence-filter-row" role="group" aria-labelledby="evidence-target-label"><span id="evidence-target-label">核验对象</span><div class="evidence-filter-options"><button type="button" class="subtle" data-evidence-target="series" aria-pressed="false" aria-controls="{{ review_filter_controls | default('evidence-cards') }}">作品</button><button type="button" class="subtle" data-evidence-target="episode" aria-pressed="true" aria-controls="{{ review_filter_controls | default('evidence-cards') }}">正片</button><button type="button" class="subtle" data-evidence-target="both" aria-pressed="false" aria-controls="{{ review_filter_controls | default('evidence-cards') }}">两者</button></div></div>
<div class="evidence-filter-footer"><p id="evidence-filter-summary" class="muted" role="status" aria-live="polite"></p><button type="button" id="evidence-filter-clear" class="subtle" aria-pressed="false" aria-controls="{{ review_filter_controls | default('evidence-cards') }}">查看全部</button></div>
<p class="muted evidence-filter-note">待核验作品可包含尚未核验的正片；待核验正片只显示作品已通过、正片尚未核验的条目。“两者”表示作品与该条正片均符合所选状态；“已排除”可按作品或正片查看人工排除记录。{% if review_filter_clear_selection | default(false) %}切换筛选会清空候选勾选。{% endif %}</p>
</div>
