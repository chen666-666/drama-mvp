<section class="panel" id="login-settings"><h2>抖音来源登录</h2><p class="muted">网站管理员账号与抖音来源登录分别管理。来源信息仅用于采集和准备视频，不会显示到播放区。</p><p id="session-status" role="status">正在检查来源登录状态…</p>
<details><summary>如何获取自己的登录信息</summary><ol><li>在抖音官网登录，打开浏览器开发者工具的“网络”。</li><li>搜索一个关键词，找到包含 search/item 或 general/search 的请求。</li><li>在请求标头中复制 Cookie 的完整值，直接填入下方，不要发到聊天中。</li></ol></details>
<form id="session-form"><label>抖音登录信息<input type="password" name="cookie" required autocomplete="off" spellcheck="false" placeholder="输入 Cookie 后保存"></label><div class="actions"><button>保存来源登录</button><button id="clear-session" type="button" class="subtle">清除来源登录</button></div></form><button id="resume-source-gate" type="button" class="subtle">处理登录 / 验证后恢复共享来源请求</button><p id="discovery-worker-status" class="muted"></p></section>
