<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>发布到网站</title><link rel="stylesheet" href="{{ static_url('theme.css') }}"><link rel="stylesheet" href="{{ static_url('library.css') }}"><script src="{{ static_url('auth.js') }}" defer></script><script src="{{ static_url('publish.js') }}" defer></script><link rel="stylesheet" href="{{ static_url('control.css') }}"></head><body class="control-page">{% set control_area = 'system' %}{% include 'control_nav.html' %}<main class="library"><p><a href="/control/system">← 返回系统与交付</a></p><header class="manage-header"><h1>发布到网站</h1><p class="muted">先预览视频与发布范围，再生成发布包。预览和生成发布包不会修改线上网站。</p></header><section class="panel"><label>首批榜单<select id="publish-ranking"></select></label><label class="check"><input type="checkbox" id="all-episodes">包含所选作品全部已通过检查的剧集（默认仅代表集）</label><p class="muted">公开发布只收录已确认公开正片、自动校验通过、人工抽检通过且文件完整的视频。实际上线前还需确认网站展示许可。</p><div class="actions"><button id="preview-release">预览发布清单</button><button id="build-release" disabled>生成本机发布包</button></div><p id="publish-status" class="status-bar" role="status">选择榜单后先预览。</p><div id="publish-result"></div></section><section class="panel"><h2>上传与上线</h2><p id="transfer-config" class="muted">检查本机发布配置…</p><label>待发布版本<select id="transfer-release"></select></label><label class="check"><input type="checkbox" id="rights-confirmed">已确认本次视频具有在网站展示的许可</label><div class="actions"><button id="upload-release" disabled>上传并预检（不上线）</button><button id="activate-release" disabled>发布上线</button></div><p id="transfer-status" class="status-bar" role="status">只有主动点击“发布上线”才会切换网站内容。</p></section><section class="panel"><h2>本机发布包</h2><div id="publish-history"></div></section></main></body></html>
