<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>抖音 Top3 · 剧集与下载</title><link rel="stylesheet" href="/static/library.css"><script src="/static/downloads.js?v=20261031-2" defer></script></head>
<body><div class="ambient" aria-hidden="true"></div><main class="library"><nav class="topbar"><a class="logo" href="/">剧选 <span>短剧灵感库</span></a><div><a href="/">返回资料库</a><a class="button subtle" href="/workbench">筛选与排名 ↗</a></div></nav>
<header class="manage-header"><p class="eyebrow">DOUYIN · DOWNLOAD LIBRARY</p><h1>把入选作品，整理到本地</h1><p class="muted">核对公开正片目录 → 试下载一集 → 校验与抽看 → 批量下载 → 导出资料包</p></header>
<div id="message" class="status-bar" role="status" aria-live="polite" hidden></div>
<div class="panel"><div class="panel-heading"><label class="version-label">当前榜单<select id="download-ranking"><option>读取榜单…</option></select></label><div class="actions"><button id="refresh" class="subtle">刷新进度</button><button id="export-package">生成本版本资料包 ↓</button></div></div><p id="ranking-info" class="muted"></p><p id="worker-status" class="status-bar">检查下载服务…</p><p class="muted">下载全部已发现且已确认公开的同剧正片，包含七天窗口之外的剧集。遇到付费、私密或访问验证会记录原因；下载状态不会改变名次。</p><a id="package-link" class="button" hidden>下载已生成资料包 ↓</a></div>
<div id="catalogs"></div><p id="empty" class="empty" hidden>当前没有入选作品，请先生成一份有合格作品的榜单。</p><footer>视频保存在此电脑的 data/videos 目录 · 自动校验与人工抽看分别记录 · 全剧目录未知时保留完整性说明</footer>
</main>
<dialog id="episode-dialog"><form id="episode-form"><div class="panel-heading"><h2>核对正片与访问范围</h2><button type="button" class="close subtle" data-close="episode-dialog" aria-label="关闭">×</button></div><input name="id" type="hidden"><label>视频标题<input name="title" required maxlength="2000"></label><div class="form-grid"><label>集号（未知留空）<input type="number" name="episode_number" min="1" step="1"></label><label>结论<select name="status"><option value="approved">确认为正片</option><option value="pending">待核验</option><option value="excluded">排除</option></select></label><label>访问范围<select name="access"><option value="public">公开可访问</option><option value="unknown">尚未确认</option><option value="private">私密</option><option value="paid">付费</option><option value="unavailable">无法访问 / 缺集</option></select></label></div><label class="check"><input name="ownership" type="checkbox">已确认是入选作品及原作者的剧集</label><label class="check"><input name="main_episode" type="checkbox">已确认是正片，排除预告、花絮与合集搬运</label><label class="check"><input name="not_duplicate" type="checkbox">已确认非重复上传</label><label>证据来源链接<input name="evidence_url" type="url" required></label><label>依据、缺集或访问原因<textarea name="note" rows="3" required></textarea></label><p class="modal-error" role="alert"></p><button>保存目录核验</button></form></dialog>
<dialog id="media-dialog"><div class="panel-heading"><h2>播放与人工抽检</h2><button type="button" class="close subtle" data-close="media-dialog" aria-label="关闭">×</button></div><video id="preview" class="preview" controls preload="metadata"></video><p id="media-info" class="note"></p><form id="media-form"><input name="id" type="hidden"><label class="check"><input name="beginning" type="checkbox">已抽看开头</label><label class="check"><input name="middle" type="checkbox">已抽看中段</label><label class="check"><input name="ending" type="checkbox">已抽看结尾</label><label class="check"><input name="sound" type="checkbox">声音与画面正常</label><label>抽检结论<select name="status"><option value="passed">人工抽检通过</option><option value="rejected">发现问题，暂不验收</option></select></label><label>抽检说明<textarea name="note" rows="2" required placeholder="记录抽看情况；发现问题时写明位置与原因"></textarea></label><p class="modal-error" role="alert"></p><button>保存人工抽检</button></form></dialog>
</body></html>
