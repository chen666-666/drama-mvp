<dialog id="quick-review-dialog" aria-labelledby="quick-title"><div class="panel-heading"><h2 id="quick-title">连续快审 · 每批最多 10 集</h2><button type="button" id="quick-close" class="subtle" aria-label="关闭快审">关闭，稍后继续</button></div><p id="quick-message" class="status-bar" role="status" aria-live="polite"></p><p id="quick-batch-status" class="muted"></p><p id="quick-errors" class="review-warning"></p><section id="quick-player" hidden><h3 id="quick-now"></h3><p id="quick-warning" class="review-warning"></p><div class="quick-video-wrap"><video id="quick-video" playsinline preload="metadata" disablepictureinpicture></video><span id="quick-overlay"></span></div><p id="quick-progress" class="muted"></p><div class="actions"><button type="button" id="quick-play">播放 / 暂停 / 继续</button><button type="button" class="subtle" id="quick-replay">重播本段</button><button type="button" class="subtle" id="quick-full">打开完整视频 ↗</button><button type="button" class="subtle" id="quick-problem">标记本集有问题</button><button type="button" class="subtle" id="quick-skip">跳过本集，继续待审</button></div><section id="quick-issue" hidden><label>问题位置与原因<textarea id="quick-reason" rows="2" maxlength="2000" placeholder="例如：中段无声、结尾黑屏、集号不符"></textarea></label><button type="button" id="quick-problem-save">记录问题并继续</button></section></section><section id="quick-summary" hidden><h3>本批结果</h3><ul id="quick-results"></ul><form id="quick-form"><label class="check"><input id="quick-confirm" type="checkbox">已实际抽看本批通过项的开头、中段、结尾，画面正常</label><label class="check"><input id="quick-sound" type="checkbox">已听到并确认本批通过项声音正常</label><label>本批抽检说明<textarea id="quick-note" required rows="3" maxlength="5000" placeholder="记录本次实际抽看片段与整体情况"></textarea></label><button id="quick-finish" disabled>保存本批已审结果</button></form></section><p class="muted">片段看完后仍须由你确认并提交。异常、跳过、未看完的剧集不会记为人工通过；观看不会自动发布。</p></dialog>
