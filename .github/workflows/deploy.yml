name: Deploy to Server 
 
on: 
  push: 
    branches: [ main ] 
 
jobs: 
  deploy: 
    runs-on: ubuntu-latest 
    steps: 
      - uses: actions/checkout@v3 
      - name: Deploy via SSH 
        uses: appleboy/ssh-action@v1.0.0 
        with: 
          host: ${{ secrets.SERVER_IP }} 
          username: ubuntu 
          key: ${{ secrets.SSH_PRIVATE_KEY }} 
            cd ~/drama-mvp 
            git pull origin main 
            sudo docker compose up -d --build 
