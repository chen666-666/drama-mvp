services:
  drama-mvp:
    build: .
    container_name: drama-mvp
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # Keep SQLite data when the container is rebuilt or replaced.
      - ./drama.db:/app/drama.db
      # The application also reads this file directly through python-dotenv.
      - ./.env:/app/.env:ro
    restart: unless-stopped
